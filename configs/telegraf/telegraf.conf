[agent]
  interval = "10s"
  round_interval = true
  flush_interval = "10s"
  hostname = "NMAS"

[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "5840Lab"
  bucket = "nmas"

[[inputs.snmp]]
  agents = [
    "udp://172.20.20.6:161",
    "udp://172.20.20.4:161",
    "udp://172.20.20.2:161",
    "udp://172.20.20.13:161",
    "udp://172.20.20.3:161",
    "udp://172.20.20.8:161",
  ]
  version = 2
  community = "${SNMP_COMMUNITY}"
  interval = "10s"

  [[inputs.snmp.field]]
    name = "device"
    oid = "1.3.6.1.2.1.1.5.0"
    is_tag = true

  [[inputs.snmp.table]]
    name = "snmp_cpu"

    [[inputs.snmp.table.field]]
      name = "cpu_load"
      oid = "1.3.6.1.2.1.25.3.3.1.2"

[[inputs.gnmi]]
  addresses = ["172.20.20.6:6030"]

  username = "admin"
  password = "${R1_GNMI_PASSWORD}"

  encoding = "json_ietf"

  tls_enable = false

  path_guessing_strategy = "subscription"
  prefix_tag_key_with_path = true

  [[inputs.gnmi.subscription]]
    name = "r1_interface_state"
    path = "/interfaces/interface/state/oper-status"
    subscription_mode = "on_change"

  [[inputs.gnmi.subscription]]
    name = "r1_interface_in_octets"
    path = "/interfaces/interface/state/counters/in-octets"
    subscription_mode = "sample"
    sample_interval = "10s"

  [[inputs.gnmi.subscription]]
    name = "r1_interface_out_octets"
    path = "/interfaces/interface/state/counters/out-octets"
    subscription_mode = "sample"
    sample_interval = "10s"

