<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Device - NMAS</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">NMAS Automation</a>
  </div>
</nav>

<div class="container mt-4">

  <div class="card shadow-sm">

    <div class="card-header">
      <h4 class="mb-0">Add New Device</h4>
    </div>

    <div class="card-body">

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">
            {{ message }}
          </div>
        {% endfor %}
      {% endwith %}

      <form method="POST">

        <h5>Device Information</h5>
        <hr>

        <div class="row">

          <div class="col-md-6 mb-3">
            <label class="form-label">Hostname</label>
            <input
              name="hostname"
              class="form-control"
              placeholder="R6"
              required>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Management / WAN IP</label>
            <input
              name="management_ip"
              class="form-control"
              placeholder="172.20.20.20"
              required>
          </div>

        </div>

        <div class="row">

          <div class="col-md-6 mb-3">
            <label class="form-label">Vendor</label>

            <select
              name="vendor"
              id="vendor"
              class="form-select"
              required>

              <option value="">Select vendor</option>
              <option value="arista">Arista</option>
              <option value="nokia">Nokia</option>

            </select>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Platform / J2 Template</label>

            <select
              name="platform"
              id="platform"
              class="form-select"
              required>

              <option value="">Select vendor first</option>

            </select>
          </div>

        </div>

        <h5 class="mt-3">Interfaces</h5>
        <hr>

        <div id="interfaces">

          <div class="row interface-row">

            <div class="col-md-3 mb-3">
              <label class="form-label">Interface Name</label>
              <input
                name="interface_name[]"
                class="form-control"
                placeholder="ethernet-1/1">
            </div>

            <div class="col-md-4 mb-3">
              <label class="form-label">IPv4</label>
              <input
                name="interface_ipv4[]"
                class="form-control"
                placeholder="10.0.60.1/30">
            </div>

            <div class="col-md-4 mb-3">
              <label class="form-label">IPv6</label>
              <input
                name="interface_ipv6[]"
                class="form-control"
                placeholder="2001:db8:5840:60::1/64">
            </div>

            <div class="col-md-1 mb-3 d-flex align-items-end">
              <button
                type="button"
                class="btn btn-danger"
                onclick="removeRow(this)">
                X
              </button>
            </div>

          </div>

        </div>

        <button
          type="button"
          class="btn btn-outline-primary mb-4"
          onclick="addInterface()">
          + Add Interface
        </button>

        <h5 class="mt-3">Loopback</h5>
        <hr>

        <div class="row">

          <div class="col-md-6 mb-3">
            <label class="form-label">Loopback IPv4</label>
            <input
              name="loopback_ipv4"
              class="form-control"
              placeholder="172.31.255.6/32">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Loopback IPv6</label>
            <input
              name="loopback_ipv6"
              class="form-control"
              placeholder="2001:db8:5840:ffff::6/128">
          </div>

        </div>

        <h5 class="mt-3">Routing</h5>
        <hr>

        <div class="row">

          <div class="col-md-4 mb-3">
            <label class="form-label">Routing Protocol</label>

            <select
              name="routing_protocol"
              id="routing_protocol"
              class="form-select">

              <option value="none">None</option>
              <option value="ospf">OSPF</option>
              <option value="bgp">BGP</option>

            </select>
          </div>

          <div
            class="col-md-4 mb-3"
            id="router_id_section">

            <label class="form-label">Router ID</label>

            <input
              name="router_id"
              class="form-control"
              placeholder="172.31.255.6">

          </div>

          <div
            class="col-md-4 mb-3"
            id="bgp_section"
            style="display:none">

            <label class="form-label">BGP Local AS</label>

            <input
              name="bgp_as"
              type="number"
              class="form-control"
              placeholder="65200">

          </div>

        </div>

        <div id="neighbors_section" style="display:none">

          <h5 class="mt-3">BGP Neighbors</h5>
          <hr>

          <div id="neighbors">

            <div class="row neighbor-row">

              <div class="col-md-5 mb-3">
                <label class="form-label">Neighbor Address</label>
                <input
                  name="neighbor_address[]"
                  class="form-control"
                  placeholder="10.0.60.2">
              </div>

              <div class="col-md-5 mb-3">
                <label class="form-label">Peer AS</label>
                <input
                  name="neighbor_as[]"
                  type="number"
                  class="form-control"
                  placeholder="65100">
              </div>

              <div class="col-md-2 mb-3 d-flex align-items-end">
                <button
                  type="button"
                  class="btn btn-danger"
                  onclick="removeRow(this)">
                  X
                </button>
              </div>

            </div>

          </div>

          <button
            type="button"
            class="btn btn-outline-primary mb-4"
            onclick="addNeighbor()">
            + Add Neighbor
          </button>

        </div>

        <button class="btn btn-primary">
          Create Device YAML
        </button>

        <a href="/" class="btn btn-secondary">
          Cancel
        </a>

      </form>

    </div>
  </div>
</div>

<script>

const vendor = document.getElementById("vendor");
const platform = document.getElementById("platform");
const routing = document.getElementById("routing_protocol");

const bgpSection = document.getElementById("bgp_section");
const neighborsSection =
  document.getElementById("neighbors_section");

vendor.addEventListener("change", function () {

  if (vendor.value === "arista") {
    platform.innerHTML =
      '<option value="ceos">Arista cEOS - ceos.j2</option>';
  }

  else if (vendor.value === "nokia") {
    platform.innerHTML =
      '<option value="srlinux">Nokia SR Linux - srlinux.j2</option>';
  }

  else {
    platform.innerHTML =
      '<option value="">Select vendor first</option>';
  }

});


routing.addEventListener("change", function () {

  if (routing.value === "bgp") {

    bgpSection.style.display = "block";
    neighborsSection.style.display = "block";

  }
  else {

    bgpSection.style.display = "none";
    neighborsSection.style.display = "none";

  }

});


function addInterface() {

  const container =
    document.getElementById("interfaces");

  const first =
    container.querySelector(".interface-row");

  const clone = first.cloneNode(true);

  clone.querySelectorAll("input").forEach(
    input => input.value = ""
  );

  container.appendChild(clone);
}


function addNeighbor() {

  const container =
    document.getElementById("neighbors");

  const first =
    container.querySelector(".neighbor-row");

  const clone = first.cloneNode(true);

  clone.querySelectorAll("input").forEach(
    input => input.value = ""
  );

  container.appendChild(clone);
}


function removeRow(button) {

  const row = button.closest(".row");
  const container = row.parentElement;

  if (container.querySelectorAll(".row").length > 1) {
    row.remove();
  }
  else {
    row.querySelectorAll("input").forEach(
      input => input.value = ""
    );
  }

}

</script>

</body>
</html>
