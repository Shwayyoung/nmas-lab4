<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Live Network Topology</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <script
    src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js">
  </script>

  <style>

    #cy {
      width: 100%;
      height: 780px;
      border: 1px solid #ccc;
      background: #f8f9fa;
    }

    #info {
      min-height: 120px;
    }

  </style>

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

  <div class="container-fluid">

    <a
      class="navbar-brand"
      href="/">
      NMAS Live Topology
    </a>

  </div>

</nav>


<div class="container-fluid mt-3">

  <div class="row">

    <div class="col-lg-9">

      <div class="card shadow-sm">

        <div class="card-header">

          <strong>
            Dynamic Network Topology
          </strong>

          <span
            id="last-update"
            class="float-end text-muted">
            Loading...
          </span>

        </div>

        <div class="mt-2">
          <span class="badge bg-success">
            UP: <span id="up-count">0</span>
          </span>

          <span class="badge bg-danger">
            DOWN: <span id="down-count">0</span>
          </span>

          <span class="badge bg-secondary">
            UNKNOWN: <span id="unknown-count">0</span>
          </span>
        </div>

        <div class="card-body p-0">

          <div id="cy"></div>

        </div>

      </div>

    </div>


    <div class="col-lg-3">

      <div
        id="info"
        class="card shadow-sm">

        <div class="card-header">
          Details
        </div>

        <div class="card-body">

          <p class="text-muted">
            Click a device or link.
          </p>

        </div>

      </div>


      <div class="card shadow-sm mt-3">

        <div class="card-header">
          Device Types
        </div>

        <div class="card-body">

          <p>
            <span
              style="
                display:inline-block;
                width:18px;
                height:18px;
                background:#6c757d;
                border:2px solid #565e64;
                vertical-align:middle;
                margin-right:8px;">
            </span>
            Host
          </p>

          <p>
            <span
              style="
                display:inline-block;
                width:18px;
                height:18px;
                background:#198754;
                border:2px solid #146c43;
                border-radius:50%;
                vertical-align:middle;
                margin-right:8px;">
            </span>
            Router
          </p>

          <p>
            <span
              style="
                display:inline-block;
                width:22px;
                height:18px;
                background:#4dabf7;
                border:2px solid #339af0;
                border-radius:5px;
                vertical-align:middle;
                margin-right:8px;">
            </span>
            Switch
          </p>

          <p class="mb-0">
            <span
              style="
                display:inline-block;
                width:22px;
                height:18px;
                background:#0d6efd;
                border:2px solid #0a58ca;
                border-radius:5px;
                vertical-align:middle;
                margin-right:8px;">
            </span>
            Multi-Layer Switch
          </p>

        </div>

      </div>


      <div class="card shadow-sm mt-3">

        <div class="card-header">
          Link Status
        </div>

        <div class="card-body">

          <p>
            <span class="badge bg-success">
              Green
            </span>
            UP
          </p>

          <p>
            <span class="badge bg-danger">
              Red
            </span>
            DOWN
          </p>

          <p>
            <span class="badge bg-secondary">
              Gray
            </span>
            UNKNOWN
          </p>

        </div>

      </div>

    </div>

  </div>

</div>


<script>

let cy;


/*
 * Convert API nodes and edges to Cytoscape elements.
 */
function createElements(data) {

  const elements = [];

  data.nodes.forEach(node => {

    elements.push({

      group: "nodes",

      data: {
        id: node.id,
        label: node.label,
        mgmt_ip: node.mgmt_ip || "",
        role: node.role || "",
        manufacturer: node.manufacturer || "",
        model: node.model || ""
      }

    });

  });


  data.edges.forEach(edge => {

    elements.push({

      group: "edges",

      data: {
        id: edge.id,

        source: edge.source,
        target: edge.target,

        source_interface:
          edge.source_interface,

        target_interface:
          edge.target_interface,

        link_label:
          edge.source_interface
          + " ↔ "
          + edge.target_interface,
          
        source_state:
          edge.source_state,

        target_state:
          edge.target_state,

        status:
          edge.status,

        cable_id:
          edge.cable_id
      }

    });

  });

  return elements;
}


/*
 * Initial topology load.
 */
async function initializeTopology() {

  const response =
    await fetch("/api/topology");

  const data =
    await response.json();

  updateStatusSummary(data);

  cy = cytoscape({

    container:
      document.getElementById("cy"),

    elements:
      createElements(data),

    style: [
/*
      {
        selector: "node",

        style: {
          "label": "data(link_label)",
          "text-valign": "center",
          "text-halign": "center",

          "background-color": "#0d6efd",
          "color": "#ffffff",

          "width": 65,
          "height": 65,

          "font-size": "14px"
        }
      },

      {
        selector: 'node[id ^= "R"]',

        style: {
          "shape": "round-rectangle",

          "label": "data(label)",
          "text-valign": "center",
          "text-halign": "center",

          "color": "#ffffff",
          "font-size": "14px"
        }
      },

      {
        selector: 'node[id ^= "S"]',

        style: {
          "shape": "rectangle",

          "label": "data(label)",
          "text-valign": "center",
          "text-halign": "center",

          "color": "#ffffff",
          "font-size": "14px"
        }
      },

      {
        selector: 'node[id ^= "H"], node[id = "Web"]',

        style: {
          "shape": "ellipse",
          "background-color": "#6c757d",

          "label": "data(label)",
          "text-valign": "center",
          "text-halign": "center",

          "color": "#ffffff",
          "font-size": "14px"
        }
      },
*/
      {
        selector: "node",

        style: {
          "label": "data(label)",
          "text-valign": "bottom",
          "text-halign": "center",
          "text-margin-y": 8,

          "color": "#000000",

          "width": 58,
          "height": 58,

          "font-size": "14px",
          "font-weight": "bold",

          "border-width": 2,
          "border-color": "#495057"
        }
      },

      /*
       * Host
       * Gray square
       */
      {
        selector: 'node[role = "Host"]',
        style: {
          "shape": "rectangle",
          "background-color": "#6c757d",
          "border-color": "#565e64",
          "width": 50,
          "height": 50
        }
      },

      /*
       * Router
       * Green circle
       */
      {
        selector: 'node[role = "Router"]',
        style: {
          "shape": "ellipse",
          "background-color": "#198754",
          "border-color": "#146c43",
          "width": 60,
          "height": 60
        }
      },

      /*
       * Layer-2 switch
       * Light blue rounded rectangle
       */
      {
        selector: 'node[role = "Switch"]',
        style: {
          "shape": "round-rectangle",
          "background-color": "#4dabf7",
          "border-color": "#339af0",
          "width": 62,
          "height": 58
        }
      },

      /*
       * Layer-3 / Multi-Layer switch
       * Dark blue rounded rectangle
       */
      {
        selector: 'node[role = "Multi-Layer Switch"]',
        style: {
          "shape": "round-rectangle",
          "background-color": "#0d6efd",
          "border-color": "#0a58ca",
          "width": 62,
          "height": 58
        }
      },

      /*
       * Fallback for any role not covered above.
       */
      {
        selector: 'node[role = ""]',
        style: {
          "shape": "rectangle",
          "background-color": "#adb5bd",
          "border-color": "#6c757d"
        }
      },

      /*
       * Make selected devices easy to identify.
       */
      {
        selector: "node:selected",
        style: {
          "border-width": 4,
          "border-color": "#212529"
        }
      },
      
      {
        selector: "edge",

        style: {
          /*
           * Keep interface labels hidden by default.
           * They are shown only while hovering over
           * or selecting a link.
           */
          "label": "",

          "font-size": "10px",
          "font-weight": "bold",

          "width": 4,

          "curve-style": "bezier",

          "line-color": "#6c757d",

          "text-background-color": "#ffffff",
          "text-background-opacity": 0.92,
          "text-background-padding": "3px",

          "text-rotation": "autorotate",
          "text-margin-y": -10
        }
      },

      {
        selector: "edge.hovered, edge:selected",

        style: {
          "label": "data(link_label)",
          "z-index": 999,
          "width": 6
        }
      },


      {
        selector:
          'edge[status = "up"]',

        style: {
          "line-color":
            "#198754"
        }
      },


      {
        selector:
          'edge[status = "down"]',

        style: {
          "line-color":
            "#dc3545"
        }
      },


      {
        selector:
          'edge[status = "unknown"]',

        style: {
          "line-color":
            "#6c757d",

          "line-style":
            "dashed"
        }
      }

    ],


    layout: {
      name: "cose",
      animate: true,
      padding: 40
    }

  });


  /*
   * Show the full interface pair only while the user
   * is hovering over a link. This keeps the topology
   * readable when many links are close together.
   */
  cy.on(
    "mouseover",
    "edge",
    function(event) {
      event.target.addClass("hovered");
    }
  );

  cy.on(
    "mouseout",
    "edge",
    function(event) {
      event.target.removeClass("hovered");
    }
  );


  /*
   * Node click information.
   */

  cy.on(
    "tap",
    "node",
    function(event) {

      const node =
        event.target.data();

      document.querySelector(
        "#info .card-body"
      ).innerHTML = `

        <h5>${node.label}</h5>

        <p>
          <strong>Management IP:</strong>
          ${node.mgmt_ip || "N/A"}
        </p>

        <p>
          <strong>Role:</strong>
          ${node.role || "N/A"}
        </p>

        <p>
          <strong>Vendor:</strong>
          ${node.manufacturer || "N/A"}
        </p>

        <p>
          <strong>Model:</strong>
          ${node.model || "N/A"}
        </p>

      `;

    }
  );


  /*
   * Edge click information.
   */

  cy.on(
    "tap",
    "edge",
    function(event) {

      const edge =
        event.target.data();

      document.querySelector(
        "#info .card-body"
      ).innerHTML = `

        <h5>
          ${edge.source}
          ↔
          ${edge.target}
        </h5>

        <p>
          <strong>Interfaces:</strong><br>

          ${edge.source}
          :
          ${edge.source_interface}

          <br>

          ${edge.target}
          :
          ${edge.target_interface}
        </p>

        <p>
          <strong>Status:</strong>
          ${edge.status.toUpperCase()}
        </p>

        <p>
          <strong>Endpoint State:</strong><br>

          ${edge.source_state}
          /
          ${edge.target_state}
        </p>

        <p>
          <strong>Cable ID:</strong>
          ${edge.cable_id}
        </p>

      `;

    }
  );


  document.getElementById(
    "last-update"
  ).innerText =
    "Updated: "
    + new Date().toLocaleTimeString();

}


/*
 * Refresh state only.
 *
 * IMPORTANT:
 * Do NOT recreate Cytoscape or rerun layout.
 * This keeps node positions stable.
 */
async function refreshStatus() {

  try {

    const response =
      await fetch("/api/topology");

    const data =
      await response.json();

    updateStatusSummary(data);

    data.edges.forEach(edge => {

      const cyEdge =
        cy.getElementById(edge.id);

      if (cyEdge.length === 0) {
        return;
      }


      cyEdge.data(
        "source_state",
        edge.source_state
      );

      cyEdge.data(
        "target_state",
        edge.target_state
      );

      cyEdge.data(
        "status",
        edge.status
      );

    });


    document.getElementById(
      "last-update"
    ).innerText =
      "Updated: "
      + new Date().toLocaleTimeString();

  }

  catch (error) {

    console.error(
      "Topology refresh failed:",
      error
    );

  }

}

/*

*/
function updateStatusSummary(data) {

  let up = 0;
  let down = 0;
  let unknown = 0;

  data.edges.forEach(edge => {

    if (edge.status === "up") {
      up++;
    }

    else if (edge.status === "down") {
      down++;
    }

    else {
      unknown++;
    }

  });

  document.getElementById(
    "up-count"
  ).innerText = up;

  document.getElementById(
    "down-count"
  ).innerText = down;

  document.getElementById(
    "unknown-count"
  ).innerText = unknown;
}

initializeTopology().then(() => {

  setInterval(
    refreshStatus,
    5000
  );

});

</script>

</body>
</html>
