{% extends "base.html" %}

{% block title %}{{ device }} YAML{% endblock %}

{% block content %}
<div class="container mt-4">

  <div class="d-flex justify-content-between mb-3">
    <h3>{{ device }} YAML</h3>

    <a
      href="/devices"
      class="btn btn-secondary">
      Back
    </a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">

      <pre class="bg-dark text-light p-3 rounded">{{ yaml_text }}</pre>

    </div>
  </div>

</div>
{% endblock %}
