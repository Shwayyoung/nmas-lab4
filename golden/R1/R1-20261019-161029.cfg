no aaa root
!
management api http-commands
   no shutdown
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
logging host 172.20.20.1
logging local-interface Management0
!
hostname R1
!
snmp-server contact NMAS
snmp-server location 5840-Lab
snmp-server community 5840RO ro
snmp-server host 172.20.20.1 version 2c 5840RO
snmp-server enable traps snmp link-down
snmp-server enable traps snmp link-up
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
interface Ethernet1
   no switchport
   ip address 10.0.101.2/30
   ipv6 address 2001:db8:5840:101::2/64
   isis enable ACCESS
   isis network point-to-point
!
interface Ethernet2
   description L3_TO_S3
   no switchport
   ip address 10.0.13.1/30
   ipv6 address 2001:db8:5840:13::1/64
   ip ospf area 0.0.0.0
   ipv6 ospf 1 area 0.0.0.0
!
interface Ethernet3
!
interface Loopback0
   description ROUTER_ID
   ip address 172.31.255.1/32
   ipv6 address 2001:db8:5840:ffff::1/128
   ip ospf area 0.0.0.0
   ipv6 ospf 1 area 0.0.0.0
!
interface Management0
   ip address 172.20.20.6/24
   ipv6 address 3fff:172:20:20::6/64
!
ip routing
!
ip prefix-list OSPF-TO-RIP
   seq 10 permit 192.168.100.0/24
!
ip prefix-list RIP-TO-OSPF
   seq 10 permit 192.168.10.0/24
   seq 20 permit 192.168.20.0/24
!
ip prefix-list WEB-IPV4
   seq 10 permit 192.168.100.0/24
!
ipv6 prefix-list ISIS-V6-HOSTS
   seq 10 permit 2001:db8:5840:10::/64
   seq 20 permit 2001:db8:5840:20::/64
   seq 30 permit 2001:db8:5840:30::/64
!
ipv6 unicast-routing
!
ip route 0.0.0.0/0 172.20.20.1
!
ipv6 route ::/0 3fff:172:20:20::1
!
route-map ISIS-TO-OSPFV3 permit 10
   match ipv6 address prefix-list ISIS-V6-HOSTS
!
route-map OSPF-TO-RIP permit 10
   match ip address prefix-list OSPF-TO-RIP
!
route-map RIP-TO-OSPF permit 10
   match ip address prefix-list RIP-TO-OSPF
!
router isis ACCESS
   net 49.0001.0000.0000.0011.00
   is-type level-2
   redistribute ospfv3 match external
   !
   address-family ipv6 unicast
!
router ospf 1
   router-id 172.31.255.1
   redistribute rip route-map RIP-TO-OSPF
   max-lsa 12000
!
ipv6 router ospf 1
   router-id 172.31.255.1
   redistribute isis level-2 route-map ISIS-TO-OSPFV3
!
router rip
   network 10.0.101.0/30
   redistribute ospf match external route-map OSPF-TO-RIP
   no shutdown
!
end
