no aaa root
!
management api http-commands
   no shutdown
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
logging trap critical
logging host 172.20.20.1
logging local-interface Management0
!
hostname S3
!
snmp-server contact NMAS
snmp-server location 5840-Lab
snmp-server community 5840RO ro
snmp-server host 172.20.20.1 version 2c 5840RO
snmp-server enable traps snmp link-down
snmp-server enable traps snmp link-up
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
interface Ethernet1
   description L3_TO_R1
   no switchport
   ip address 10.0.13.2/30
   ipv6 address 2001:db8:5840:13::3/64
   ip ospf area 0.0.0.0
   ipv6 ospf 1 area 0.0.0.0
!
interface Ethernet2
   description L3_TO_S4
   no switchport
   ip address 10.0.34.1/30
   ipv6 address 2001:db8:5840:34::3/64
   ip ospf area 0.0.0.0
   ipv6 ospf 1 area 0.0.0.0
!
interface Ethernet3
   description L3_TO_R3
   no switchport
   ip address 10.0.33.1/30
   ipv6 address 2001:db8:5840:33::3/64
   ip ospf area 0.0.0.0
   ipv6 ospf 1 area 0.0.0.0
!
interface Loopback0
   description ROUTER_ID
   ip address 172.31.255.13/32
   ipv6 address 2001:db8:5840:ffff::13/128
   ip ospf area 0.0.0.0
   ipv6 ospf 1 area 0.0.0.0
!
interface Management0
   ip address 172.20.20.3/24
   ipv6 address 3fff:172:20:20::3/64
!
ip routing
!
ipv6 unicast-routing
!
ip route 0.0.0.0/0 172.20.20.1
!
ipv6 route ::/0 3fff:172:20:20::1
!
router ospf 1
   router-id 172.31.255.13
   max-lsa 12000
!
ipv6 router ospf 1
   router-id 172.31.255.13
!
end
