no aaa root
!
management api http-commands
   no shutdown
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
logging trap critical
logging host 172.20.20.1
logging local-interface Management0
!
hostname R6
!
snmp-server contact NMAS
snmp-server location 5840-Lab
snmp-server community 5840RO ro
snmp-server host 172.20.20.1 version 2c 5840RO
snmp-server enable traps snmp link-down
snmp-server enable traps snmp link-up
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
interface Ethernet1
   description L3_TO_R4
   no switchport
   ip address 10.0.46.2/30
   ipv6 address 2001:db8:5840:46::6/64
   ip ospf area 0.0.0.10
   ipv6 ospf 1 area 0.0.0.10
!
interface Ethernet2
   description L3_TO_R7
   no switchport
   ip address 10.0.67.1/30
   ipv6 address 2001:db8:5840:67::6/64
   isis enable ZTP
   isis network point-to-point
!
interface Loopback0
   description ROUTER_ID
   ip address 172.31.255.6/32
   ipv6 address 2001:db8:5840:ffff::6/128
   ip ospf area 0.0.0.10
   ipv6 ospf 1 area 0.0.0.10
!
interface Management0
   ip address 172.20.20.16/24
   ipv6 address 3fff:172:20:20::10/64
!
ip routing
!
ip prefix-list RIP-TO-OSPF
   seq 10 permit 192.168.40.0/24
   seq 20 permit 172.31.255.7/32
!
ip prefix-list OSPF-TO-RIP
   seq 10 permit 192.168.10.0/24
   seq 20 permit 192.168.20.0/24
   seq 30 permit 192.168.100.0/24
   seq 40 permit 192.168.50.0/24
!
ipv6 prefix-list ISIS-TO-OSPFV3
   seq 10 permit 2001:db8:5840:40::/64
   seq 20 permit 2001:db8:5840:ffff::7/128
!
ipv6 prefix-list OSPFV3-TO-ISIS
   seq 10 permit 2001:db8:5840:10::/64
   seq 20 permit 2001:db8:5840:20::/64
   seq 30 permit 2001:db8:5840:30::/64
   seq 40 permit 2001:db8:5840:100::/64
   seq 50 permit 2001:db8:5840:50::/64
!
ipv6 unicast-routing
!
ip route 0.0.0.0/0 172.20.20.1
!
ipv6 route ::/0 3fff:172:20:20::1
!
route-map RIP-TO-OSPF permit 10
   match ip address prefix-list RIP-TO-OSPF
!
route-map ISIS-TO-OSPFV3 permit 10
   match ipv6 address prefix-list ISIS-TO-OSPFV3
!
route-map OSPF-TO-RIP permit 10
   match ip address prefix-list OSPF-TO-RIP
!
route-map OSPFV3-TO-ISIS permit 10
   match ipv6 address prefix-list OSPFV3-TO-ISIS
!
router isis ZTP
   net 49.0001.0000.0000.0006.00
   is-type level-2
   redistribute ospfv3 match external route-map OSPFV3-TO-ISIS
   redistribute ospfv3 match internal route-map OSPFV3-TO-ISIS
   !
   address-family ipv6 unicast
!
router ospf 1
   router-id 172.31.255.6
   redistribute rip route-map RIP-TO-OSPF
   max-lsa 12000
!
ipv6 router ospf 1
   router-id 172.31.255.6
   redistribute isis level-2 route-map ISIS-TO-OSPFV3
!
router rip
   network 10.0.67.0/30
   redistribute ospf match external route-map OSPF-TO-RIP
   redistribute ospf match internal route-map OSPF-TO-RIP
   no shutdown
!
end
