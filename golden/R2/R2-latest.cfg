no aaa root
!
management api http-commands
   no shutdown
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
logging trap critical
logging host 172.20.20.1
logging local-interface Management0
!
hostname R2
!
snmp-server contact NMAS
snmp-server location 5840-Lab
snmp-server enable traps snmp link-down
snmp-server enable traps snmp link-up
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
interface Ethernet1
   description L3_TO_S2
   no switchport
   ip address 10.0.102.2/30
   ipv6 address 2001:db8:5840:102::2/64
   isis enable ACCESS
   isis network point-to-point
!
interface Ethernet2
   description L3_TO_S4
   no switchport
   ip address 10.0.24.1/30
   ipv6 address 2001:db8:5840:24::2/64
   ip ospf area 0.0.0.0
   ipv6 ospf 1 area 0.0.0.0
!
interface Loopback0
   description ROUTER_ID
   ip address 172.31.255.2/32
   ipv6 address 2001:db8:5840:ffff::2/128
   ip ospf area 0.0.0.0
   ipv6 ospf 1 area 0.0.0.0
!
interface Management0
   ip address 172.20.20.4/24
   ipv6 address 3fff:172:20:20::4/64
!
ip routing
!
ip prefix-list WEB-IPV4
   seq 10 permit 192.168.100.0/24
!
ipv6 prefix-list ISIS-V6-HOSTS
   seq 10 permit 2001:db8:5840:10::/64
   seq 20 permit 2001:db8:5840:20::/64
   seq 30 permit 2001:db8:5840:30::/64
   seq 40 permit 2001:db8:5840:999::/64
!
ipv6 prefix-list OSPFV3-TO-ISIS
   seq 10 permit 2001:db8:5840:100::/64
!
ipv6 unicast-routing
!
ip route 0.0.0.0/0 172.20.20.1
!
ipv6 route ::/0 3fff:172:20:20::1
!
route-map ISIS-TO-OSPFV3 permit 10
   match ipv6 address prefix-list ISIS-V6-HOSTS
!
route-map OSPFV3-TO-ISIS permit 10
   match ipv6 address prefix-list OSPFV3-TO-ISIS
!
router isis ACCESS
   net 49.0001.0000.0000.0012.00
   is-type level-2
   redistribute ospfv3 match external route-map OSPFV3-TO-ISIS
   !
   address-family ipv6 unicast
!
router ospf 1
   router-id 172.31.255.2
   redistribute rip
   max-lsa 12000
!
ipv6 router ospf 1
   router-id 172.31.255.2
   redistribute isis level-2 route-map ISIS-TO-OSPFV3
!
router rip
   network 10.0.102.0/30
   redistribute ospf match external
   no shutdown
!
end
