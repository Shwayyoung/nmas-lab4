set / system name host-name R3

set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 subinterface 0 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 10.0.33.2/30
set / interface ethernet-1/1 subinterface 0 ipv6 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv6 address 2001:db8:5840:33::33/64
set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 subinterface 0 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 address 10.0.34.5/30
set / interface ethernet-1/2 subinterface 0 ipv6 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv6 address 2001:db8:5840:304::3/64
set / interface ethernet-1/3 admin-state enable
set / interface ethernet-1/3 subinterface 0 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 address 10.0.35.1/30
set / interface ethernet-1/3 subinterface 0 ipv6 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv6 address 2001:db8:5840:35::3/64
set / interface lo0 subinterface 0 admin-state enable
set / interface lo0 subinterface 0 ipv4 admin-state enable
set / interface lo0 subinterface 0 ipv4 address 172.31.255.3/32
set / interface lo0 subinterface 0 ipv6 admin-state enable
set / interface lo0 subinterface 0 ipv6 address 2001:db8:5840:ffff::3/128
set / interface mgmt0 admin-state enable
set / interface mgmt0 subinterface 0 admin-state enable
set / interface mgmt0 subinterface 0 ipv4 admin-state enable
set / interface mgmt0 subinterface 0 ipv4 dhcp-client
set / interface mgmt0 subinterface 0 ipv6 admin-state enable
set / interface mgmt0 subinterface 0 ipv6 dhcp-client

set / routing-policy prefix-set HOST-IPV4 prefix 192.168.10.0/24 mask-length-range 24..24
set / routing-policy prefix-set HOST-IPV4 prefix 192.168.20.0/24 mask-length-range 24..24
set / routing-policy prefix-set HOST-IPV6 prefix 2001:db8:5840:10::/64 mask-length-range 64..64
set / routing-policy prefix-set HOST-IPV6 prefix 2001:db8:5840:20::/64 mask-length-range 64..64
set / routing-policy prefix-set HOST-IPV6 prefix 2001:db8:5840:30::/64 mask-length-range 64..64
set / routing-policy prefix-set WEB-IPV4 prefix 192.168.100.0/24 mask-length-range 24..24
set / routing-policy prefix-set WEB-IPV6 prefix 2001:db8:5840:100::/64 mask-length-range 64..64

set / routing-policy policy HOST-IPV4-EXPORT default-action policy-result reject
set / routing-policy policy HOST-IPV4-EXPORT statement 10 match prefix prefix-set HOST-IPV4
set / routing-policy policy HOST-IPV4-EXPORT statement 10 action policy-result accept
set / routing-policy policy WEB-IPV4-IMPORT default-action policy-result reject
set / routing-policy policy WEB-IPV4-IMPORT statement 10 match prefix prefix-set WEB-IPV4
set / routing-policy policy WEB-IPV4-IMPORT statement 10 action policy-result accept
set / routing-policy policy WEB-IPV4-IMPORT statement 10 action route-preference set 140
set / routing-policy policy HOST-IPV6-EXPORT default-action policy-result reject
set / routing-policy policy HOST-IPV6-EXPORT statement 10 match prefix prefix-set HOST-IPV6
set / routing-policy policy HOST-IPV6-EXPORT statement 10 action policy-result accept
set / routing-policy policy WEB-IPV6-IMPORT default-action policy-result reject
set / routing-policy policy WEB-IPV6-IMPORT statement 10 match prefix prefix-set WEB-IPV6
set / routing-policy policy WEB-IPV6-IMPORT statement 10 action policy-result accept
set / routing-policy policy WEB-IPV6-IMPORT statement 10 action route-preference set 140

set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0
set / network-instance default interface ethernet-1/3.0
set / network-instance default interface lo0.0
set / network-instance default protocols ospf instance ospfv2 admin-state enable
set / network-instance default protocols ospf instance ospfv2 version ospf-v2
set / network-instance default protocols ospf instance ospfv2 router-id 172.31.255.3
set / network-instance default protocols ospf instance ospfv2 export-policy WEB-IPV4-IMPORT
set / network-instance default protocols ospf instance ospfv2 area 0.0.0.0 interface ethernet-1/1.0
set / network-instance default protocols ospf instance ospfv2 area 0.0.0.0 interface ethernet-1/2.0
set / network-instance default protocols ospf instance ospfv2 area 0.0.0.0 interface lo0.0
set / network-instance default protocols ospf instance ospfv3 admin-state enable
set / network-instance default protocols ospf instance ospfv3 version ospf-v3
set / network-instance default protocols ospf instance ospfv3 router-id 172.31.255.3
set / network-instance default protocols ospf instance ospfv3 export-policy WEB-IPV6-IMPORT
set / network-instance default protocols ospf instance ospfv3 address-family ipv6-unicast
set / network-instance default protocols ospf instance ospfv3 area 0.0.0.0 interface ethernet-1/1.0
set / network-instance default protocols ospf instance ospfv3 area 0.0.0.0 interface ethernet-1/2.0
set / network-instance default protocols ospf instance ospfv3 area 0.0.0.0 interface lo0.0
set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65000
set / network-instance default protocols bgp router-id 172.31.255.3
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group EBGP admin-state enable
set / network-instance default protocols bgp group EBGP afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group EBGP afi-safi ipv4-unicast export-policy [ HOST-IPV4-EXPORT ]
set / network-instance default protocols bgp group EBGP afi-safi ipv4-unicast import-policy [ WEB-IPV4-IMPORT ]
set / network-instance default protocols bgp afi-safi ipv6-unicast admin-state enable
set / network-instance default protocols bgp group EBGP admin-state enable
set / network-instance default protocols bgp group EBGP afi-safi ipv6-unicast admin-state enable
set / network-instance default protocols bgp group EBGP afi-safi ipv6-unicast export-policy [ HOST-IPV6-EXPORT ]
set / network-instance default protocols bgp group EBGP afi-safi ipv6-unicast import-policy [ WEB-IPV6-IMPORT ]
set / network-instance default protocols bgp neighbor 10.0.35.2 peer-as 65100
set / network-instance default protocols bgp neighbor 10.0.35.2 peer-group EBGP
set / network-instance default protocols bgp neighbor 2001:db8:5840:35::5 peer-as 65100
set / network-instance default protocols bgp neighbor 2001:db8:5840:35::5 peer-group EBGP
set / network-instance mgmt type ip-vrf
set / network-instance mgmt admin-state enable
set / network-instance mgmt description "Management network instance"
set / network-instance mgmt interface mgmt0.0
set / network-instance mgmt protocols linux import-routes true
set / network-instance mgmt protocols linux export-routes true
set / network-instance mgmt protocols linux export-neighbors true
