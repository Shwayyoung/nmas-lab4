set / system name host-name R5

set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 subinterface 0 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 10.0.35.2/30
set / interface ethernet-1/1 subinterface 0 ipv6 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv6 address 2001:db8:5840:35::5/64
set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 subinterface 0 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 address 10.0.45.2/30
set / interface ethernet-1/2 subinterface 0 ipv6 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv6 address 2001:db8:5840:45::5/64
set / interface ethernet-1/3 admin-state enable
set / interface ethernet-1/3 subinterface 0 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 address 192.168.100.1/24
set / interface ethernet-1/3 subinterface 0 ipv6 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv6 address 2001:db8:5840:100::1/64
set / interface lo0 subinterface 0 admin-state enable
set / interface lo0 subinterface 0 ipv4 admin-state enable
set / interface lo0 subinterface 0 ipv4 address 172.31.255.5/32
set / interface lo0 subinterface 0 ipv6 admin-state enable
set / interface lo0 subinterface 0 ipv6 address 2001:db8:5840:ffff::5/64
set / interface mgmt0 admin-state enable
set / interface mgmt0 subinterface 0 admin-state enable
set / interface mgmt0 subinterface 0 ipv4 admin-state enable
set / interface mgmt0 subinterface 0 ipv4 dhcp-client
set / interface mgmt0 subinterface 0 ipv6 admin-state enable
set / interface mgmt0 subinterface 0 ipv6 dhcp-client

set / routing-policy prefix-set HOST-IPV4 prefix 192.168.10.0/24 mask-length-range 24..24
set / routing-policy prefix-set HOST-IPV4 prefix 192.168.20.0/24 mask-length-range 24..24
set / routing-policy prefix-set HOST-IPV6 prefix 2001:db8:5840:10::/64 mask-length-range 64..64
set / routing-policy prefix-set HOST-IPV6 prefix 2001:db8:5840:20::/64 mask-length-range 64..64
set / routing-policy prefix-set HOST-IPV6 prefix 2001:db8:5840:30::/64 mask-length-range 64..64
set / routing-policy prefix-set WEB-IPV4 prefix 192.168.100.0/24 mask-length-range 24..24
set / routing-policy prefix-set WEB-IPV6 prefix 2001:db8:5840:100::/64 mask-length-range 64..64

set / routing-policy policy WEB-IPV4-EXPORT default-action policy-result reject
set / routing-policy policy WEB-IPV4-EXPORT statement 10 match prefix prefix-set WEB-IPV4
set / routing-policy policy WEB-IPV4-EXPORT statement 10 action policy-result accept
set / routing-policy policy HOST-IPV4-IMPORT default-action policy-result reject
set / routing-policy policy HOST-IPV4-IMPORT statement 10 match prefix prefix-set HOST-IPV4
set / routing-policy policy HOST-IPV4-IMPORT statement 10 action policy-result accept
set / routing-policy policy WEB-IPV6-EXPORT default-action policy-result reject
set / routing-policy policy WEB-IPV6-EXPORT statement 10 match prefix prefix-set WEB-IPV6
set / routing-policy policy WEB-IPV6-EXPORT statement 10 action policy-result accept
set / routing-policy policy HOST-IPV6-IMPORT default-action policy-result reject
set / routing-policy policy HOST-IPV6-IMPORT statement 10 match prefix prefix-set HOST-IPV6
set / routing-policy policy HOST-IPV6-IMPORT statement 10 action policy-result accept

set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0
set / network-instance default interface ethernet-1/3.0
set / network-instance default interface lo0.0
set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65100
set / network-instance default protocols bgp router-id 172.31.255.5
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group EBGP admin-state enable
set / network-instance default protocols bgp group EBGP afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group EBGP afi-safi ipv4-unicast export-policy [ WEB-IPV4-EXPORT ]
set / network-instance default protocols bgp group EBGP afi-safi ipv4-unicast import-policy [ HOST-IPV4-IMPORT ]
set / network-instance default protocols bgp afi-safi ipv6-unicast admin-state enable
set / network-instance default protocols bgp group EBGP admin-state enable
set / network-instance default protocols bgp group EBGP afi-safi ipv6-unicast admin-state enable
set / network-instance default protocols bgp group EBGP afi-safi ipv6-unicast export-policy [ WEB-IPV6-EXPORT ]
set / network-instance default protocols bgp group EBGP afi-safi ipv6-unicast import-policy [ HOST-IPV6-IMPORT ]
set / network-instance default protocols bgp neighbor 10.0.35.1 peer-as 65000
set / network-instance default protocols bgp neighbor 10.0.35.1 peer-group EBGP
set / network-instance default protocols bgp neighbor 10.0.45.1 peer-as 65000
set / network-instance default protocols bgp neighbor 10.0.45.1 peer-group EBGP
set / network-instance default protocols bgp neighbor 2001:db8:5840:35::3 peer-as 65000
set / network-instance default protocols bgp neighbor 2001:db8:5840:35::3 peer-group EBGP
set / network-instance default protocols bgp neighbor 2001:db8:5840:45::4 peer-as 65000
set / network-instance default protocols bgp neighbor 2001:db8:5840:45::4 peer-group EBGP
set / network-instance mgmt type ip-vrf
set / network-instance mgmt admin-state enable
set / network-instance mgmt description "Management network instance"
set / network-instance mgmt interface mgmt0.0
set / network-instance mgmt protocols linux import-routes true
set / network-instance mgmt protocols linux export-routes true
set / network-instance mgmt protocols linux export-neighbors true
