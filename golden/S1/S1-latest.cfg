no aaa root
!
management api http-commands
   no shutdown
!
ip dhcp relay information option
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
logging trap critical
logging host 172.20.20.1
logging local-interface Management0
!
hostname S1
!
snmp-server contact NMAS
snmp-server location 5840-Lab
snmp-server community 5840RO ro
snmp-server host 172.20.20.1 version 2c 5840RO
snmp-server enable traps snmp link-down
snmp-server enable traps snmp link-up
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 10
   name VLAN10
!
vlan 20
   name VLAN20
!
vlan 30
   name VLAN30
!
vlan 999
   name RIP_TRANSIT
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
interface Ethernet1
   description H1_VLAN10
   switchport access vlan 10
!
interface Ethernet2
   description H2_VLAN
   switchport access vlan 20
!
interface Ethernet3
   description TRUNK_TO_S2
   switchport trunk allowed vlan 10,20,30,999
   switchport mode trunk
!
interface Ethernet4
   description L3_TO_R1
   no switchport
   ip address 10.0.101.1/30
   ipv6 address 2001:db8:5840:101::1/64
   isis enable ACCESS
   isis network point-to-point
!
interface Loopback0
   ip address 172.31.255.11/24
   ipv6 address 2001:db8:5840:ffff::11/64
!
interface Management0
   ip address 172.20.20.2/24
   ipv6 address 3fff:172:20:20::2/64
!
interface Vlan10
   description GATEWAY_VLAN10
   ip address 192.168.10.2/24
   ip helper-address 172.20.20.1 source-interface Management0
   ipv6 address 2001:db8:5840:10::2/64
   isis enable ACCESS
   isis passive
   vrrp 10 priority-level 110
   vrrp 10 ipv4 192.168.10.1
   vrrp 110 priority-level 110
   vrrp 110 ipv6 2001:db8:5840:10::1
!
interface Vlan20
   description GATEWAY_VLAN20
   ip address 192.168.20.2/24
   ip helper-address 172.20.20.1
   ipv6 address 2001:db8:5840:20::2/64
   isis enable ACCESS
   isis passive
   vrrp 20 ipv4 192.168.20.1
   vrrp 120 ipv6 2001:db8:5840:20::1
!
interface Vlan30
   description GATEWAY_VLAN30_IPV6_ONLY
   ipv6 address 2001:db8:5840:30::2/64
   isis enable ACCESS
   isis passive
   vrrp 130 ipv6 2001:db8:5840:30::1
!
interface Vlan999
   description L3_TRANSIT_TO_S2
   ip address 10.0.199.1/30
   ipv6 address 2001:db8:5840:999::1/64
   isis enable ACCESS
   isis network point-to-point
!
ip routing
!
ipv6 unicast-routing
!
ip route 0.0.0.0/0 172.20.20.1
!
ipv6 route ::/0 3fff:172:20:20::1
!
router isis ACCESS
   net 49.0001.0000.0000.0001.00
   is-type level-2
   !
   address-family ipv6 unicast
!
router rip
   network 10.0.101.0/30
   network 10.0.199.0/30
   network 192.168.10.0/24
   network 192.168.20.0/24
   no shutdown
!
end
