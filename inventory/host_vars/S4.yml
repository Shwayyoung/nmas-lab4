hostname: S4
vendor: arista
platform: ceos

logging_trap: critical
logging_host: 172.20.20.1

snmp_community: 5840RO
snmp_host: 172.20.20.1

management:
  ipv4: 172.20.20.8/24
  ipv6: 3fff:172:20:20::8/64
  gateway_ipv4: 172.20.20.1
  gateway_ipv6: 3fff:172:20:20::1

interfaces:
  - name: Ethernet1
    description: L3_TO_R2
    mode: routed
    ipv4: 10.0.24.2/30
    ipv6: 2001:db8:5840:24::4/64
    ospf_area: 0.0.0.0
    ospfv3_process: 1

  - name: Ethernet2
    description: L3_TO_S3
    mode: routed
    ipv4: 10.0.34.2/30
    ipv6: 2001:db8:5840:34::4/64
    ospf_area: 0.0.0.0
    ospfv3_process: 1

  - name: Ethernet3
    description: L3_TO_R4
    mode: routed
    ipv4: 10.0.44.1/30
    ipv6: 2001:db8:5840:44::4/64
    ospf_area: 0.0.0.0
    ospfv3_process: 1

loopback:
  description: ROUTER_ID
  ipv4: 172.31.255.14/32
  ipv6: 2001:db8:5840:ffff::14/128
  ospf_area: 0.0.0.0
  ospfv3_process: 1

routing:
  router_id: 172.31.255.14

  ospf:
    process: 1
    max_lsa: 12000