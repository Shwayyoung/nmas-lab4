hostname: R4
vendor: nokia
platform: srlinux

interfaces:
  - {name: ethernet-1/1, ipv4: 10.0.44.2/30, ipv6: "2001:db8:5840:44::44/64"}
  - {name: ethernet-1/2, ipv4: 10.0.34.6/30, ipv6: "2001:db8:5840:304::4/64"}
  - {name: ethernet-1/3, ipv4: 10.0.45.1/30, ipv6: "2001:db8:5840:45::4/64"}

loopback:
  ipv4: 172.31.255.4/32
  ipv6: "2001:db8:5840:ffff::4/128"

ospf:
  router_id: 172.31.255.4
  interfaces: [ethernet-1/1.0, ethernet-1/2.0, lo0.0]
  ipv4_export_policy: WEB-IPV4-IMPORT
  ipv6_export_policy: WEB-IPV6-IMPORT

bgp:
  local_as: 65000
  router_id: 172.31.255.4
  group: EBGP

  ipv4_import_preference: 140
  ipv6_import_preference: 140

  neighbors:
    - {address: 10.0.45.2, peer_as: 65100}
    - {address: "2001:db8:5840:45::5", peer_as: 65100}

prefix_sets:
  HOST-IPV4: ["192.168.10.0/24", "192.168.20.0/24"]
  HOST-IPV6: ["2001:db8:5840:10::/64", "2001:db8:5840:20::/64", "2001:db8:5840:30::/64"]
  WEB-IPV4: ["192.168.100.0/24"]
  WEB-IPV6: ["2001:db8:5840:100::/64"]