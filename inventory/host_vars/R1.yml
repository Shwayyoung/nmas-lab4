hostname: R1
vendor: arista
platform: ceos

logging_host: 172.20.20.1

snmp_community: 5840RO
snmp_host: 172.20.20.1

management:
  ipv4: 172.20.20.6/24
  ipv6: 3fff:172:20:20::6/64
  gateway_ipv4: 172.20.20.1
  gateway_ipv6: 3fff:172:20:20::1

interfaces:
  - name: Ethernet1
    mode: routed
    ipv4: 10.0.101.2/30
    ipv6: 2001:db8:5840:101::2/64
    isis: ACCESS
    isis_p2p: true

  - name: Ethernet2
    description: L3_TO_S3
    mode: routed
    ipv4: 10.0.13.1/30
    ipv6: 2001:db8:5840:13::1/64
    ospf_area: 0.0.0.0
    ospfv3_process: 1
    ospfv3_area: 0.0.0.0

  - name: Ethernet3

loopback:
  description: ROUTER_ID
  ipv4: 172.31.255.1/32
  ipv6: 2001:db8:5840:ffff::1/128
  ospf_area: 0.0.0.0
  ospfv3_process: 1
  ospfv3_area: 0.0.0.0

routing:
  router_id: 172.31.255.1

  ipv4_prefix_lists:
    OSPF-TO-RIP:
      - "seq 10 permit 192.168.100.0/24"

    RIP-TO-OSPF:
      - "seq 10 permit 192.168.10.0/24"
      - "seq 20 permit 192.168.20.0/24"

    WEB-IPV4:
      - "seq 10 permit 192.168.100.0/24"

  ipv6_prefix_lists:
    ISIS-V6-HOSTS:
      - "seq 10 permit 2001:db8:5840:10::/64"
      - "seq 20 permit 2001:db8:5840:20::/64"
      - "seq 30 permit 2001:db8:5840:30::/64"

  route_maps:
    - name: ISIS-TO-OSPFV3
      action: permit
      sequence: 10
      match: "ipv6 address prefix-list ISIS-V6-HOSTS"

    - name: OSPF-TO-RIP
      action: permit
      sequence: 10
      match: "ip address prefix-list OSPF-TO-RIP"

    - name: RIP-TO-OSPF
      action: permit
      sequence: 10
      match: "ip address prefix-list RIP-TO-OSPF"

  isis:
    process: ACCESS
    net: 49.0001.0000.0000.0011.00
    level: level-2
    redistribute:
      - "ospfv3 match external"

  ospf:
    process: 1
    max_lsa: 12000
    redistribute:
      - "rip route-map RIP-TO-OSPF"
    redistribute_ipv6:
      - "isis level-2 route-map ISIS-TO-OSPFV3"

  rip:
    networks:
      - 10.0.101.0/30
    redistribute:
      - "ospf match external route-map OSPF-TO-RIP"