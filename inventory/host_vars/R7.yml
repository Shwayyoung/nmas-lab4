hostname: R7
vendor: arista
platform: ceos

logging_trap: critical
logging_host: 172.20.20.1

snmp_community: 5840RO
snmp_host: 172.20.20.1

management:
  ipv4: 172.20.20.17/24
  ipv6: 3fff:172:20:20::11/64
  gateway_ipv4: 172.20.20.1
  gateway_ipv6: 3fff:172:20:20::1

interfaces:
  - name: Ethernet1
    description: L3_TO_R6
    mode: routed
    ipv4: 10.0.67.2/30
    ipv6: 2001:db8:5840:67::7/64
    isis: ZTP
    isis_p2p: true

  - name: Ethernet2
    description: L3_TO_H5
    mode: routed
    ipv4: 192.168.40.1/24
    ipv6: 2001:db8:5840:40::1/64
    isis: ZTP
    isis_passive: true

loopback:
  description: ROUTER_ID
  ipv4: 172.31.255.7/32
  ipv6: 2001:db8:5840:ffff::7/128
  isis: ZTP
  isis_passive: true

routing:
  router_id: 172.31.255.7

  ipv4_prefix_lists:
    RIP_CONNECTED:
      - seq 10 permit 192.168.40.0/24
      - seq 20 permit 172.31.255.7/32

  route_maps:
    - name: RIP_CONNECTED
      action: permit
      sequence: 10
      match: ip address prefix-list RIP_CONNECTED

  rip:
    networks:
      - 10.0.67.0/30
    redistribute:
      - connected route-map RIP_CONNECTED

  isis:
    process: ZTP
    net: 49.0001.0000.0000.0007.00
    level: level-2
